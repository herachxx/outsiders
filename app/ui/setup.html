<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f6f8"><title>Настройка оператора · Grand Mobile Support</title>
<link rel="stylesheet" href="/ui/style.css"><link rel="stylesheet" href="/ui/login.css"><script src="/ui/setup.js" defer></script></head>
<body><main class="login-screen"><div class="login-card">
<div class="login-logo"><strong>G</strong> GRAND MOBILE <span class="login-product">/ Support</span></div>
<h1>Первый запуск</h1><p>Создайте пароль для панели оператора. Это единственная настройка — она сохранится на вашем компьютере.</p>
<form id="setup-form"><label for="password">Пароль оператора</label><input type="password" id="password" minlength="12" autocomplete="new-password" required autofocus placeholder="Не менее 12 символов">
<label for="confirm" style="margin-top:18px">Повторите пароль</label><input type="password" id="confirm" minlength="12" autocomplete="new-password" required>
<button type="submit" id="submit">Создать пароль и продолжить</button><p class="login-error" role="alert" id="error"></p></form>
<p class="setup-hint">Данные и пароль хранятся локально. Не удаляйте папку <code>data</code>, если хотите сохранить обращения и доступ.</p>
</div><p class="login-foot"><a href="/">Вернуться на страницу игрока</a></p></main></body></html>
