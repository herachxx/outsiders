[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "grand-support-copilot"
version = "0.7.0"
description = "Local Grand Mobile support: verified rules, optional CatBoost, optional localhost Qwen, operator workflow"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "starlette>=0.40,<0.50", "pydantic>=2.8,<3", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "pillow>=10,<13", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
ml = ["scikit-learn==1.9.1", "joblib>=1.4,<2", "catboost>=1.2,<2", "numpy>=1.26,<3", "scipy>=1.13,<2"]
language = ["fasttext>=0.9.3,<1"]

[project.scripts]
grand-predict = "app.batch:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.package-data]
app = ["templates/*.json", "ui/*.html", "ui/*.css", "ui/*.js", "ui/*.svg"]
